<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!--
      Per-page SEO (title, description, canonical, Open Graph, Twitter card,
      JSON-LD) is NOT hand-written here. src/seo/pages.json is the single source:
      scripts/prerender.mjs bakes it into each route's HTML at build time, and
      <Seo> keeps it current during client-side navigation. The two tags below
      are only the fallback for the dev server.
    -->
    <title>Swapngo | EV Scooter Rental in Chennai &amp; Fleet Management Software</title>
    <meta
      name="description"
      content="EV scooter rental in Chennai with unlimited kilometres and battery swapping, plus SwapNgo Fleet: fleet management software with an admin app and rider mobile app."
    />
    <meta name="author" content="Swapngo" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Browser / App Theme -->
    <meta name="theme-color" content="#21C45D" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
