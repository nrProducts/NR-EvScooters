# Render Blueprint — all three deployables in this monorepo:
#   1. backend  (apps/backend)  — Express API, Node web service
#   2. web      (apps/web)      — admin console + rider web app, static site (Vite)
#   3. website  (apps/website)  — public marketing site, static site (Vite)
#
# FOLDER STRATEGY — do NOT split the repo, and do NOT set a Render "Root
# Directory" to apps/<name>. This is a pnpm workspace: `pnpm install` must run
# at the repo root, where pnpm-workspace.yaml + pnpm-lock.yaml live. So every
# service:
#   • points at this same repo, rootDir: "."  (the repo root)
#   • builds ONLY its own app with `pnpm --filter <name> build`
#   • publishes a different folder:
#       backend  → runs apps/backend/dist/server.js  (Node service)
#       web      → serves apps/web/dist              (static)
#       website  → serves apps/website/dist          (static)
#
# `buildFilter` below means a service only rebuilds when its own apps/<name>/**
# (or a shared root file) changes — a website-only commit won't redeploy the
# backend.
#
# Secrets / cross-service URLs are `sync: false` — Render prompts for each on
# first deploy and never stores them here. Deploy order matters for the URLs:
# backend first, then web (needs the backend URL), then website (needs the
# web URL). See docs/DEPLOY_RENDER.md.

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: nr-evscooters-backend
    runtime: node
    plan: starter
    region: singapore # change to your closest region
    branch: main
    rootDir: .
    autoDeploy: true
    buildFilter:
      paths:
        - apps/backend/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - render.yaml
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter backend build
    startCommand: pnpm --filter backend start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.16.0"

      # --- Supabase (all three required; service-role key is backend-only) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- KYC field encryption (two DIFFERENT 32-byte base64 secrets) ------
      #   openssl rand -base64 32
      - key: KYC_ENCRYPTION_KEY
        sync: false
      - key: KYC_HMAC_PEPPER
        sync: false

      # --- Razorpay (mandatory in production — boot fails without them) -----
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # --- Invited-staff password-set landing page (the web console URL) ---
      - key: INVITE_REDIRECT_URL
        sync: false

      # --- Geocoding proxy (rider battery-station area search) -------------
      - key: GEOCODE_URL
        value: https://photon.komoot.io/api

      # --- Transactional email (Resend) — optional, blank = disabled ------
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_APP_URL
        sync: false

      # --- MSG91 (only the /auth/otp/test diagnostic) — optional ----------
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Admin console + rider web app (static)
  # ---------------------------------------------------------------------------
  - type: web
    name: nr-evscooters-web
    runtime: static
    branch: main
    rootDir: .
    autoDeploy: true
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - render.yaml
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: apps/web/dist
    # BrowserRouter — every path must fall back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      # Full backend base URL INCLUDING /api/v1, e.g.
      #   https://nr-evscooters-backend.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/liberty

  # ---------------------------------------------------------------------------
  # 3. Public marketing website (static)
  # ---------------------------------------------------------------------------
  - type: web
    name: nr-evscooters-website
    runtime: static
    branch: main
    rootDir: .
    autoDeploy: true
    buildFilter:
      paths:
        - apps/website/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - render.yaml
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter website build
    staticPublishPath: apps/website/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      # The deployed web console URL, e.g. https://nr-evscooters-web.onrender.com
      - key: VITE_ADMIN_CONSOLE_URL
        sync: false
      # Backend API base URL incl. /api/v1 (e.g. https://api.swapngo.in/api/v1)
      # — powers the live plan pricing + fleet/station counts on the site.
      # Blank = the site runs on its bundled fallback content.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PLAY_STORE_URL
        sync: false
      - key: VITE_APP_STORE_URL
        sync: false
