name: Release

# develop -> UAT (cndqvdskrcmivqflbttl)      automatic
# main    -> production (separate account)    plan, then manual approval
#
# What it deploys: supabase/migrations (db push) and every function in
# supabase/functions. It does NOT touch Auth settings, Vault secrets, function
# secrets or app data — those are one-time setup per environment
# (supabase/SETUP.md).
#
# It is also the release gate for the backend. The Render services use
# "auto-deploy: after CI checks pass", so Render deploys a commit only once
# every job here has finished green: backend-check (build + tests), the
# database deploy, and — on main — the approved prod-deploy. That is why this
# runs on EVERY push to develop/main, not only supabase/** changes: Render
# deploys nothing for a commit with zero checks.
#
# GitHub setup (Settings -> Environments), each with the same four secrets:
#   uat              SUPABASE_ACCESS_TOKEN  token from the UAT Supabase account
#                    SUPABASE_DB_PASSWORD   UAT database password
#                    SUPABASE_PROJECT_ID    cndqvdskrcmivqflbttl
#                    SEND_SMS_HOOK_SECRET   that project's Send SMS hook secret
#                                           (config.toml references it; the CLI
#                                           refuses to run if it is malformed)
#   production-plan  prod token / password / ref; deployment branch: main
#   production       same values as production-plan; deployment branch: main;
#                    required reviewer = the person who approves prod deploys
# production-plan has no reviewer so the dry-run is visible BEFORE approval.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# One deploy per environment at a time; never cancel one mid-push.
concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned so a CLI release cannot change deploy behaviour unannounced.
  # Bump deliberately.
  SUPABASE_CLI_VERSION: 2.119.0

jobs:
  # Every PR and push: the backend must build and its tests must pass before
  # anything deploys. No secrets — tests run against a fake Supabase.
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter backend...
      - run: pnpm --filter backend build
      - run: pnpm --filter backend test

  # PR into develop: show the SQL that would run on UAT. Applies nothing.
  uat-plan:
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    environment: uat
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --dry-run

  uat-deploy:
    needs: backend-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: uat
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

  # Push to main: dry-run against production first. Read this job's log
  # before approving prod-deploy.
  prod-plan:
    needs: backend-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-plan
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --dry-run

  prod-deploy:
    needs: prod-plan
    runs-on: ubuntu-latest
    environment: production   # waits here for the required reviewer
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
